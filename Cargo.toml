[workspace]
resolver = "2"
members = [
  "crates/usage-halo-core",
  "crates/usage-halo-reconcile",
  "crates/usage-halo-storage",
  "crates/usage-halo-scheduler",
  "crates/usage-halo-secrets",
  "crates/usage-halo-forecast",
  "connectors/claude-code",
  "connectors/codex",
  "connectors/gemini-cli",
  "connectors/openai",
  "connectors/anthropic",
  "connectors/openrouter",
  "apps/desktop-ui/src-tauri"
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://example.invalid/usagehalo"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "uuid", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "time", "sync", "fs"] }
uuid = { version = "1", features = ["v4", "serde"] }
